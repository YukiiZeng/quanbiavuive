<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rót Bia Quán Bar - Firebase Sync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="header-bar">
      <div class="stat-card">
        <span class="stat-label">TỔNG TÀI SẢN</span>
        <div class="money" id="money-display">0 Coin</div>
      </div>
      <div class="status-msg" id="status-display">Đang kết nối dữ liệu đám mây...</div>
    </header>

    <div class="customer-card">
      <div class="customer-header">
        <span class="customer-name" id="customer-name">👤 Khách Đang Đến...</span>
        <span class="glass-tag" id="glass-tag">🍺 Ly Vừa</span>
      </div>
      <div class="order-desc" id="order-desc">Yêu cầu: Rót từ 80% - 90% ly</div>
    </div>

    <section class="stage-section" id="stage-section">
      <div class="beer-tap-machine" id="tap-machine">
        <div class="tap-top"></div>          
        <div class="tap-body"></div>         
        <div class="tap-handle"></div>       
        <div class="tap-nozzle">
          <div class="beer-stream" id="beer-stream"></div>
        </div>
      </div>

      <div class="glass-wrapper" id="glass-wrapper">
        <div class="glass-container glass-medium" id="glass-container">
          <div class="target-zone" id="target-zone">VÙNG VÀNG</div>
          <div class="beer-liquid" id="beer-liquid">
            <div class="beer-foam"></div>
          </div>
        </div>
        <div class="glass-handle" id="glass-handle"></div>
      </div>

      <button class="pour-btn" id="pour-btn">
        <span class="btn-icon">🍺</span>
        <span class="btn-text">GIỮ ĐỂ RÓT BIA</span>
      </button>
    </section>

    <main class="panel-section">
      <div class="placeholder-card">
        <div class="card-title">⚙️ SHOP QUÁN BIA</div>
        <p>Khu vực mở rộng vòi rót, thuê nhân viên và mở trang trí quán sẽ xuất hiện tại đây...</p>
      </div>
    </main>
  </div>

  <!-- 1. THƯ VIỆN FIREBASE SDK (COMPAT) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- 2. CÁC FILE LOGIC GAME -->
  <script src="firebase.js"></script>
  <script src="logic.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>

</body>
</html>
